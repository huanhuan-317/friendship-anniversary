<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的友谊 - 三个人的纪念日</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #6366F1;
      --secondary-color: #8B5CF6;
      --accent-color: #EC4899;
      --bg-light: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --shadow-sm: 0 2px 8px rgba(99, 102, 241, 0.08);
      --shadow-md: 0 4px 16px rgba(99, 102, 241, 0.12);
      --shadow-lg: 0 8px 32px rgba(99, 102, 241, 0.16);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    body {
      font-family: 'Poppins', 'Noto Serif SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #F0F4FF 0%, #F5F0FF 50%, #FFF0F5 100%);
      min-height: 100vh;
      color: var(--text-primary);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 48px 0;
      text-align: center;
      position: relative;
    }

    .friendship-badge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    .badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
    }

    .badge:nth-child(1) { background: linear-gradient(135deg, #F472B6, #EC4899); }
    .badge:nth-child(2) { background: linear-gradient(135deg, #A78BFA, #8B5CF6); }
    .badge:nth-child(3) { background: linear-gradient(135deg, #60A5FA, #3B82F6); }

    header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      margin-top: 20px;
    }

    header p {
      color: var(--text-secondary);
      font-weight: 400;
      font-size: 1.1rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .nav-tab {
      padding: 10px 24px;
      border-radius: var(--radius-lg);
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .nav-tab.active {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      box-shadow: var(--shadow-md);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      font-size: 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid #E2E8F0;
    }

    .btn-secondary:hover {
      background: var(--bg-light);
    }

    .btn-icon {
      padding: 8px;
      border-radius: var(--radius-sm);
    }

    .btn-danger {
      background: #FED7D7;
      color: #C53030;
    }

    .btn-danger:hover {
      background: #FEB2B2;
    }

    .add-btn-container {
      text-align: center;
      margin-bottom: 32px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding-bottom: 40px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .card-type {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .card-type.friendship { background: #EEF2FF; color: #6366F1; }
    .card-type.birthday { background: #FEF3C7; color: #D97706; }
    .card-type.travel { background: #DBEAFE; color: #2563EB; }
    .card-type.important { background: #FCE7F3; color: #BE185D; }
    .card-type.other { background: #F1F5F9; color: #64748B; }

    .card-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card:hover .card-actions {
      opacity: 1;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .card-date {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .countdown {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.08));
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }

    .countdown-number {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .countdown-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-description {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #F1F5F9;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .gallery-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding-bottom: 40px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 4/3;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .gallery-item:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-lg);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
      padding: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .gallery-item:hover .overlay {
      opacity: 1;
    }

    .gallery-item .overlay p {
      color: white;
      font-size: 14px;
      font-weight: 500;
    }

    .add-photo-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(99, 102, 241, 0.1);
      border: 2px dashed rgba(99, 102, 241, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .add-photo-btn:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .add-photo-btn svg {
      width: 32px;
      height: 32px;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .add-photo-btn span {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .photo-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .photo-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .photo-modal {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: var(--radius-lg);
      overflow: hidden;
      transform: scale(0.9);
      transition: all 0.3s ease;
    }

    .photo-modal-overlay.active .photo-modal {
      transform: scale(1);
    }

    .photo-modal img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    .photo-modal-info {
      background: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-modal-info h3 {
      font-size: 1rem;
      color: var(--text-primary);
    }

    .photo-modal-info p {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 90%;
      max-width: 480px;
      transform: scale(0.9) translateY(20px);
      transition: all 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .btn-close {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }

    .btn-close:hover {
      background: var(--bg-light);
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E2E8F0;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
      background: var(--bg-card);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .form-select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 12px center;
      background-repeat: no-repeat;
      background-size: 16px;
      padding-right: 40px;
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .empty-state {
      text-align: center;
      padding: 64px 20px;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .empty-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-desc {
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .detail-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .detail-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .detail-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 90%;
      max-width: 500px;
      transform: scale(0.9) translateY(20px);
      transition: all 0.3s ease;
    }

    .detail-overlay.active .detail-card {
      transform: scale(1) translateY(0);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .detail-countdown {
      text-align: center;
      margin-bottom: 24px;
    }

    .detail-countdown .countdown-number {
      font-size: 4rem;
    }

    .detail-info {
      background: var(--bg-light);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }

    .detail-info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #E2E8F0;
    }

    .detail-info-row:last-child {
      border-bottom: none;
    }

    .detail-info-label {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .detail-info-value {
      color: var(--text-primary);
    }

    .footer {
      text-align: center;
      padding: 32px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .friendship-footer {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .friendship-footer span {
      font-size: 1.25rem;
    }

    @media (max-width: 640px) {
      header h1 {
        font-size: 1.75rem;
      }

      .cards-grid, .gallery-section {
        grid-template-columns: 1fr;
      }

      .modal, .detail-card {
        padding: 24px;
      }

      .badge {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="friendship-badge">
        <div class="badge">👩</div>
        <div class="badge">👩</div>
        <div class="badge">👩</div>
      </div>
      <h1>我们的友谊</h1>
      <p>三个人的故事，永远的美好回忆</p>
    </header>

    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="anniversary">纪念日</button>
      <button class="nav-tab" data-tab="gallery">相册</button>
    </div>

    <div id="anniversarySection">
      <div class="add-btn-container">
        <button class="btn btn-primary" id="addBtn">
          <span>+</span>
          <span>添加纪念日</span>
        </button>
      </div>

      <div class="cards-grid" id="cardsGrid">
      </div>
    </div>

    <div id="gallerySection" style="display: none;">
      <div class="gallery-section" id="galleryGrid">
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="friendship-footer">
      <span>💕</span>
      <span>👭</span>
      <span>💕</span>
    </div>
    <p>愿我们的友谊长存 ❤️</p>
  </footer>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">添加纪念日</h2>
        <button class="btn-close" id="closeModal">
          <span style="font-size: 20px;">×</span>
        </button>
      </div>
      <form id="addForm">
        <div class="form-group">
          <label class="form-label" for="name">纪念日名称</label>
          <input type="text" class="form-control" id="name" required placeholder="例如：相识纪念日">
        </div>
        <div class="form-group">
          <label class="form-label" for="date">日期</label>
          <input type="date" class="form-control" id="date" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="type">类型</label>
          <select class="form-control form-select" id="type" required>
            <option value="friendship">友谊纪念日</option>
            <option value="birthday">生日</option>
            <option value="travel">旅行回忆</option>
            <option value="important">重要时刻</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="description">回忆（可选）</label>
          <textarea class="form-control form-textarea" id="description" placeholder="写下当时的美好回忆..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-card">
      <div class="detail-header">
        <div>
          <span class="card-type" id="detailType"></span>
          <h2 class="modal-title" id="detailName"></h2>
        </div>
        <button class="btn-close" id="closeDetail">
          <span style="font-size: 20px;">×</span>
        </button>
      </div>
      <div class="detail-countdown">
        <div class="countdown-number" id="detailCountdown"></div>
        <div class="countdown-label" id="detailCountdownLabel"></div>
      </div>
      <div class="detail-info">
        <div class="detail-info-row">
          <span class="detail-info-label">日期</span>
          <span class="detail-info-value" id="detailDate"></span>
        </div>
        <div class="detail-info-row">
          <span class="detail-info-label">类型</span>
          <span class="detail-info-value" id="detailTypeText"></span>
        </div>
        <div class="detail-info-row" id="detailDescriptionRow" style="display: none;">
          <span class="detail-info-label">回忆</span>
          <span class="detail-info-value" id="detailDescription"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="deleteBtn">删除</button>
        <button type="button" class="btn btn-secondary" id="editBtn">编辑</button>
      </div>
    </div>
  </div>

  <div class="photo-modal-overlay" id="photoModal">
    <div class="photo-modal">
      <img id="modalPhoto" src="" alt="">
      <div class="photo-modal-info">
        <div>
          <h3 id="photoTitle"></h3>
          <p id="photoDate"></p>
        </div>
        <button class="btn-close" id="closePhotoModal">
          <span style="font-size: 20px;">×</span>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addPhotoModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">添加照片</h2>
        <button class="btn-close" id="closeAddPhotoModal">
          <span style="font-size: 20px;">×</span>
        </button>
      </div>
      <form id="addPhotoForm">
        <div class="form-group">
          <label class="form-label" for="photoUrl">照片链接</label>
          <input type="url" class="form-control" id="photoUrl" required placeholder="输入图片URL">
        </div>
        <div class="form-group">
          <label class="form-label" for="photoTitle">照片标题</label>
          <input type="text" class="form-control" id="photoTitle" placeholder="这张照片的故事...">
        </div>
        <div class="form-group">
          <label class="form-label" for="photoDate">日期</label>
          <input type="date" class="form-control" id="photoDateInput">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelPhotoBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const typeLabels = {
      friendship: '友谊纪念日',
      birthday: '生日',
      travel: '旅行回忆',
      important: '重要时刻',
      other: '其他'
    };

    const ANNIVERSARY_KEY = 'friendship_anniversary';
    const PHOTOS_KEY = 'friendship_photos';

    const GITHUB_REPO = 'huanhuan-317/friendship-anniversary';

    function getInitialAnniversaries() {
      return [
        { id: '1', name: '相识纪念日', date: '2011-09-01', type: 'friendship', description: '第一次转学来见到你们，开启了我们的友谊之旅' },
        { id: '2', name: '15周年纪念日', date: '2026-09-01', type: 'friendship', description: '我们相识15周年啦，友谊长存！' }
      ];
    }

    function getInitialPhotos() {
      return [
        { id: '1', url: 'https://huanhuan-317.github.io/friendship-anniversary/20431c874b8c90663e4ec81785a8a6e7.jpg', title: '一起看给阿嬷的情书', date: '2026-05-21' },
        { id: '2', url: 'https://huanhuan-317.github.io/friendship-anniversary/61c4f0e8a6a05253c22f41260def345f.jpg', title: '一起吃淀粉肠', date: '2026-05-21' }
      ];
    }

    function saveAnniversaries(data) {
      localStorage.setItem(ANNIVERSARY_KEY, JSON.stringify(data));
    }

    function savePhotos(data) {
      localStorage.setItem(PHOTOS_KEY, JSON.stringify(data));
    }

    function calculateDays(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr);
      target.setHours(0, 0, 0, 0);
      
      const diff = target - today;
      const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
      
      return days;
    }

    function getCountdownInfo(dateStr) {
      const days = calculateDays(dateStr);
      if (days === 0) {
        return { number: 0, label: '今天就是！', isToday: true };
      } else if (days > 0) {
        return { number: days, label: '天后', isToday: false };
      } else {
        const passed = Math.abs(days);
        return { number: passed, label: '天', isToday: false, hasPassed: true };
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function createCard(item) {
      const { number, label } = getCountdownInfo(item.date);
      
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = item.id;
      
      card.innerHTML = `
        <div class="card-header">
          <span class="card-type ${item.type}">${typeLabels[item.type]}</span>
          <div class="card-actions">
            <button class="btn btn-icon btn-secondary edit-btn" data-id="${item.id}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="btn btn-icon btn-danger delete-btn" data-id="${item.id}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"/>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>
        <h3 class="card-title">${item.name}</h3>
        <p class="card-date">${formatDate(item.date)}</p>
        <div class="countdown">
          <div class="countdown-number">${number}</div>
          <div class="countdown-label">${label}</div>
        </div>
        ${item.description ? `<p class="card-description">${item.description}</p>` : ''}
      `;
      
      return card;
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      let data = JSON.parse(localStorage.getItem(ANNIVERSARY_KEY) || '[]');
      
      if (data.length === 0) {
        data = getInitialAnniversaries();
        saveAnniversaries(data);
      }
      
      if (data.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📅</div>
            <h3 class="empty-title">还没有纪念日</h3>
            <p class="empty-desc">点击上方按钮添加我们的第一个纪念日吧！</p>
          </div>
        `;
        return;
      }
      
      const sortedData = [...data].sort((a, b) => {
        const daysA = calculateDays(a.date);
        const daysB = calculateDays(b.date);
        return daysA - daysB;
      });
      
      grid.innerHTML = '';
      sortedData.forEach(item => {
        grid.appendChild(createCard(item));
      });
    }

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const initialPhotos = getInitialPhotos();
      let storedPhotos = JSON.parse(localStorage.getItem(PHOTOS_KEY) || '[]');
      
      if (storedPhotos.length === 0 || storedPhotos.length !== initialPhotos.length) {
        savePhotos(initialPhotos);
        storedPhotos = initialPhotos;
      }
      
      grid.innerHTML = '';
      
      storedPhotos.forEach(photo => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.dataset.id = photo.id;
        item.innerHTML = `
          <img src="${photo.url}" alt="${photo.title}">
          <div class="overlay">
            <p>${photo.title}</p>
          </div>
        `;
        grid.appendChild(item);
      });
      
      const addBtn = document.createElement('div');
      addBtn.className = 'gallery-item add-photo-btn';
      addBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>
        <span>添加照片</span>
      `;
      grid.appendChild(addBtn);
    }

    function switchTab(tabName) {
      document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      
      document.getElementById('anniversarySection').style.display = tabName === 'anniversary' ? 'block' : 'none';
      document.getElementById('gallerySection').style.display = tabName === 'gallery' ? 'block' : 'none';
    }

    function openAddModal() {
      document.getElementById('addModal').classList.add('active');
      document.getElementById('addForm').reset();
      document.getElementById('date').value = '';
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
    }

    function openDetailModal(id) {
      const data = JSON.parse(localStorage.getItem(ANNIVERSARY_KEY) || '[]');
      const item = data.find(d => d.id === id);
      
      if (!item) return;
      
      const { number, label } = getCountdownInfo(item.date);
      
      document.getElementById('detailName').textContent = item.name;
      document.getElementById('detailType').className = `card-type ${item.type}`;
      document.getElementById('detailType').textContent = typeLabels[item.type];
      document.getElementById('detailDate').textContent = formatDate(item.date);
      document.getElementById('detailTypeText').textContent = typeLabels[item.type];
      document.getElementById('detailCountdown').textContent = number;
      document.getElementById('detailCountdownLabel').textContent = label;
      
      if (item.description) {
        document.getElementById('detailDescription').textContent = item.description;
        document.getElementById('detailDescriptionRow').style.display = 'flex';
      } else {
        document.getElementById('detailDescriptionRow').style.display = 'none';
      }
      
      document.getElementById('detailOverlay').classList.add('active');
      document.getElementById('detailOverlay').dataset.id = id;
    }

    function closeDetailModal() {
      document.getElementById('detailOverlay').classList.remove('active');
    }

    function deleteItem(id) {
      const data = JSON.parse(localStorage.getItem(ANNIVERSARY_KEY) || '[]');
      const filtered = data.filter(d => d.id !== id);
      saveAnniversaries(filtered);
      renderCards();
      closeDetailModal();
    }

    function editItem(id) {
      const data = JSON.parse(localStorage.getItem(ANNIVERSARY_KEY) || '[]');
      const item = data.find(d => d.id === id);
      
      if (!item) return;
      
      document.getElementById('name').value = item.name;
      document.getElementById('date').value = item.date;
      document.getElementById('type').value = item.type;
      document.getElementById('description').value = item.description || '';
      
      closeDetailModal();
      openAddModal();
      
      const form = document.getElementById('addForm');
      form.dataset.editId = id;
      document.querySelector('.modal-title').textContent = '编辑纪念日';
    }

    function openPhotoModal(id) {
      const photos = JSON.parse(localStorage.getItem(PHOTOS_KEY) || '[]');
      const photo = photos.find(p => p.id === id);
      
      if (!photo) return;
      
      document.getElementById('modalPhoto').src = photo.url;
      document.getElementById('photoTitle').textContent = photo.title || '美好回忆';
      document.getElementById('photoDate').textContent = formatDate(photo.date);
      document.getElementById('photoModal').classList.add('active');
    }

    function closePhotoModal() {
      document.getElementById('photoModal').classList.remove('active');
    }

    function openAddPhotoModal() {
      document.getElementById('addPhotoModal').classList.add('active');
      document.getElementById('addPhotoForm').reset();
      document.getElementById('photoDateInput').value = '';
    }

    function closeAddPhotoModal() {
      document.getElementById('addPhotoModal').classList.remove('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCards();
      renderGallery();
      
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          switchTab(tab.dataset.tab);
        });
      });
      
      document.getElementById('addBtn').addEventListener('click', openAddModal);
      document.getElementById('closeModal').addEventListener('click', closeAddModal);
      document.getElementById('cancelBtn').addEventListener('click', closeAddModal);
      document.getElementById('closeDetail').addEventListener('click', closeDetailModal);
      document.getElementById('closePhotoModal').addEventListener('click', closePhotoModal);
      document.getElementById('closeAddPhotoModal').addEventListener('click', closeAddPhotoModal);
      document.getElementById('cancelPhotoBtn').addEventListener('click', closeAddPhotoModal);
      
      document.getElementById('addForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const id = e.target.dataset.editId || Date.now().toString();
        const data = JSON.parse(localStorage.getItem(ANNIVERSARY_KEY) || '[]');
        
        const item = {
          id,
          name: document.getElementById('name').value,
          date: document.getElementById('date').value,
          type: document.getElementById('type').value,
          description: document.getElementById('description').value || undefined
        };
        
        let updatedData;
        if (e.target.dataset.editId) {
          updatedData = data.map(d => d.id === id ? item : d);
          document.querySelector('.modal-title').textContent = '添加纪念日';
        } else {
          updatedData = [...data, item];
        }
        
        saveAnniversaries(updatedData);
        renderCards();
        closeAddModal();
        delete e.target.dataset.editId;
      });
      
      document.getElementById('addPhotoForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const id = Date.now().toString();
        const photos = JSON.parse(localStorage.getItem(PHOTOS_KEY) || '[]');
        
        const photo = {
          id,
          url: document.getElementById('photoUrl').value,
          title: document.getElementById('photoTitle').value || undefined,
          date: document.getElementById('photoDateInput').value || undefined
        };
        
        savePhotos([...photos, photo]);
        renderGallery();
        closeAddPhotoModal();
      });
      
      document.addEventListener('click', (e) => {
        if (e.target.closest('.card')) {
          const card = e.target.closest('.card');
          const editBtn = e.target.closest('.edit-btn');
          const deleteBtn = e.target.closest('.delete-btn');
          
          if (editBtn) {
            e.stopPropagation();
            editItem(editBtn.dataset.id);
          } else if (deleteBtn) {
            e.stopPropagation();
            if (confirm('确定要删除这个纪念日吗？')) {
              deleteItem(deleteBtn.dataset.id);
            }
          } else {
            openDetailModal(card.dataset.id);
          }
        }
        
        if (e.target.closest('.gallery-item')) {
          const item = e.target.closest('.gallery-item');
          if (item.classList.contains('add-photo-btn')) {
            openAddPhotoModal();
          } else {
            openPhotoModal(item.dataset.id);
          }
        }
      });
      
      document.getElementById('deleteBtn').addEventListener('click', () => {
        const id = document.getElementById('detailOverlay').dataset.id;
        if (confirm('确定要删除这个纪念日吗？')) {
          deleteItem(id);
        }
      });
      
      document.getElementById('editBtn').addEventListener('click', () => {
        const id = document.getElementById('detailOverlay').dataset.id;
        editItem(id);
      });
    });
  </script>
</body>
</html>
